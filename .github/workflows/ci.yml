name: Continuous Integration - E-commerce Microservices

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # -------------------------------------------------------------
  # Job 3: Pruebas del Backend C (Pagos - Python + FastAPI)
  # -------------------------------------------------------------
  test-pagos:
    name: Test Pagos (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pagos/requirements.txt

      - name: Install dependencies
        run: |
          cd pagos
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          cd pagos
          pytest
